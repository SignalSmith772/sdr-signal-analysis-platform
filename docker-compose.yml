version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models
      - sdr-db:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/sdr_platform.db
      - ML_MODEL_PATH=/app/ml/models/modulation_classifier.pkl

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  sdr-db:
